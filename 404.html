<!DOCTYPE html>

    <head>

        <script>
            (function () {
                var t = null;
                try { t = localStorage.getItem('theme'); } catch (e) {}
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link href="/css/modern.css" rel="stylesheet" />
        <style>
            body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 2rem 1rem; box-sizing: border-box; }
            .nf { width: 100%; max-width: 40rem; min-width: 0; }
            .nf .tl { white-space: pre-wrap; overflow-wrap: anywhere; }

            .nf-code span { color: var(--accent); }
            .nf-lead { color: var(--muted); margin: 0 0 1.5rem; }

            .nf .terminal-body a:hover { text-decoration: underline; }

            .nf-actions { margin-top: 1.5rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }

<pre class="terminal-body"><code><span class="tl"><span class="tp">$</span> cd <span id="path">/missing</span></span>

        <script>
            (function () {
                var p = decodeURIComponent(location.pathname).slice(0, 60) || '/';
                document.getElementById('path').textContent = p;
                document.getElementById('path2').textContent = p;
            })();
